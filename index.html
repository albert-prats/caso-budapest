{let hc='';try{hc=decodeURIComponent(location.hash.slice(1)).trim().toLowerCase()}catch(e){}if(OKC.test(hc)){cod=hc;pi=paisGuardado()}}

const INICIO=()=>'<h2>Empezar</h2><p>Una persona crea la partida y pasa el enlace al grupo. Todos los que abran ese enlace juegan la misma partida, sin registrarse.</p><button class="go" onclick="crear()">Crear partida nueva</button><h3>¿Tienes un código o un enlace?</h3><p class="fila"><input id="cj" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="por ejemplo, k7m2qa" aria-label="Código de partida" onkeydown="if(event.key===\'Enter\')unirse()"> <button onclick="unirse()">Entrar</button></p>'+(warn?'<p class="bad">'+warn+'</p>':'')+est();

/dt><dd>Tu expediente: los temas que solo tú ves, con sus pruebas.</dd><dt>Acusación</dt><dd>La decisión de cada país: un sospechoso y la lectura de su arma. Es definitiva: solo cuenta la primera que se registra.</dd></dl>'+nx(2,'Ir a mi ficha de país →');
function ficha(){let h='';M[pi].forEach(t=>{const d=gap(t);h+='<div class="k"><h3>Sospechoso: '+S[t]+'</h3><p class="mu">Escena: '+MON[t]+'</p><div class="r"><span>Budapest</span><span><b>'+f(D.B[t])+'</b> / 10</span></div><div class="r"><span>Referencia</span><span>'+f(D.R[t])+' / 10</span></div><div class="r"><span>Diferencia</span><span class="'+(d<=-1?'bad':'')+'">'+(d>0?'+':'')+f(d)+'</span></div><div class="r"><span>En '+D.P[pi][0]+' (mediana)</span><span>'+f(D.P[pi][1][t])+' / 10</span></div><h3>Armas de este sospechoso</h3>'+D.W.filter(w=>w[1]==t).map(w=>'<div class="r"><span>'+w[0]+'</span><span class="'+(worse(w)?'bad':'')+'">'+f(w[3])+' <span class="mu">(ref. '+f(w[4])+')</span> '+(worse(w)?'▼ peor':'▲ mejor')+'</span></div>').join('')+'</div>'});return h}
